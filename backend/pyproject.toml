[project]
name = "8d-copilot"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "google-adk>=1.0",
  "google-genai>=1.0",
  "google-cloud-bigquery>=3.26",
  "google-cloud-firestore>=2.19",
  "google-cloud-storage>=2.18",
  "pandas>=2.2",
  "numpy>=2.0",
  "scipy>=1.14",
  "matplotlib>=3.9",
  "openpyxl>=3.1",
  "pillow>=10.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27",
  # anyio>=4.15 deprecates anyio.abc.BlockingPortal, which the installed starlette
  # (fastapi's TestClient) still imports — upgrading starlette to the first release
  # that fixes this (1.x) in turn requires an `httpx2` package that isn't published
  # yet. Pin below the deprecation until one side moves. Only `fastapi.testclient`
  # (imported by the test suite) hits this path, so the pin belongs here, not in the
  # runtime dependencies a deployed service installs.
  "anyio<4.15",
]

[tool.setuptools.packages.find]
include = ["agent*", "data*", "infra*"]
