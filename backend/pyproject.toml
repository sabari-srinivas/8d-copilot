[project]
name = "8d-copilot"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "google-genai>=1.0",
  # agent/tools/doc_search.py's DOCS_BACKEND=vertex path (what Cloud Run actually runs)
  # does `import agentplatform` / `from agentplatform import rag` for the Vertex AI RAG
  # Engine client. That top-level module ships inside google-cloud-aiplatform's
  # "agent-engines" extra -- it has nothing to do with ADK -- but until now it only
  # ever arrived transitively via the (now-removed) google-adk dependency, which
  # pinned exactly this range. Declaring it directly here is the correct fix, not
  # bringing ADK back: ADK itself is still unused. Found live, the hard way: removing
  # google-adk without this made a fresh container build (gcloud run deploy --source,
  # which runs `pip install -e .` from scratch) raise ModuleNotFoundError the moment a
  # real investigation reached the evidence/doc-search step -- a path no test exercises,
  # since doc_search.py imports agentplatform lazily specifically "so no test path ever
  # loads it" (see that module's own comment).
  "google-cloud-aiplatform[agent-engines]>=1.95.1,<2.0.0",
  "google-cloud-bigquery>=3.26",
  "google-cloud-bigquery-storage>=2.24",   # faster to_dataframe(); avoids a UserWarning
  "db-dtypes>=1.3",       # required by bigquery.QueryJob.to_dataframe() for DATE columns
  "google-cloud-firestore>=2.19",
  "google-cloud-storage>=2.18",
  "pandas>=2.2",
  "numpy>=2.0",
  "scipy>=1.14",
  "matplotlib>=3.9",
  "openpyxl>=3.1",
  "pillow>=10.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27",
  # anyio>=4.15 deprecates anyio.abc.BlockingPortal, which the installed starlette
  # (fastapi's TestClient) still imports — upgrading starlette to the first release
  # that fixes this (1.x) in turn requires an `httpx2` package that isn't published
  # yet. Pin below the deprecation until one side moves. Only `fastapi.testclient`
  # (imported by the test suite) hits this path, so the pin belongs here, not in the
  # runtime dependencies a deployed service installs.
  "anyio<4.15",
]

[tool.setuptools.packages.find]
include = ["agent*", "data*", "infra*"]
